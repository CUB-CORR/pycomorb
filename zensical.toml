[project]
site_name = "pycomorb"
site_description = "Time-aware comorbidity and frailty scores from ICD codes"
repo_url = "https://github.com/CUB-CORR/pycomorb"
extra_css = ["stylesheets/extra.css"]
nav = [
  { "Home" = "index.md" },
  { "Scores" = "scores.md" },
  { "Input and output" = "input-output.md" },
  { "ICD modification" = "icd-modification.md" },
  { "Custom index" = "custom.md" },
  { "Reporting" = "reporting.md" },
  { "References" = "references.md" },
  { "API" = "api.md" },
  { "Development" = "development.md" },
]

[project.theme]
features = ["content.code.copy", "navigation.sections"]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Light mode"

[project.markdown_extensions]
admonition = {}
md_in_html = {}
tables = {}
pymdownx.superfences = {}

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
docstring_options = { returns_named_value = false }
show_root_heading = true
annotations_path = "source"
