[project]
name = "pycomorb"
dynamic = ["version"]
authors = [
  { name="Finn S. Fassbender", email="finn.fassbender@charite.de" },
]
description = "Comorbidity and frailty score calculation utilities (Charlson, Elixhauser, Gagne, HFRS) using polars"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "polars>=1.0.0",
    "pyyaml",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[build-system]
requires = ["setuptools>=61", "setuptools-scm>=8"]
build-backend = "_build_backend"
backend-path = ["."]

[tool.setuptools]
packages = ["pycomorb"]

[tool.setuptools.package-data]
pycomorb = ["common/**/*.csv", "common/**/*.yaml"]

[tool.setuptools_scm]
version_file = "pycomorb/_version.py"