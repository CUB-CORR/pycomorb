[project]
name = "pycomorb"
dynamic = ["version"]
authors = [
  { name="Finn S. Fassbender", email="research@finnfassbender.de" },
]
description = "Comorbidity and frailty score calculation utilities (Charlson, Elixhauser, Gagne, HFRS) using polars"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "pyarrow",
    "polars>=1.21.0",
    "pyyaml",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*", "NOTICE"]

[build-system]
requires = ["setuptools>=61", "setuptools-scm>=8"]
build-backend = "_build_backend"
backend-path = ["."]

[tool.setuptools]
packages = ["pycomorb"]

[tool.setuptools.package-data]
pycomorb = ["common/**/*.csv", "common/**/*.yaml"]

[tool.setuptools_scm]
version_file = "pycomorb/_version.py"

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]

[tool.pytest.ini_options]
testpaths = ["test"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source_pkgs = ["pycomorb"]
branch = true
omit = ["*/pycomorb/_version.py"]  # generated by setuptools-scm

[tool.coverage.report]
fail_under = 100
show_missing = true
